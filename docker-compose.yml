# Serviços de infraestrutura para desenvolvimento, quando houver Docker local.
# Hoje o desenvolvimento usa SQLite e fila sync (ver docs/adr/0003).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: plataforma
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
