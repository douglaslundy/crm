openapi: 3.1.0
info:
  title: API da Plataforma Fiscal
  version: 1.0.0
  description: |
    API pública para emitir NF-e, NFC-e e NFS-e e gerenciar cadastros e webhooks.

    Autenticação por chave `Authorization: Bearer <chave>`. Chaves `live_` operam em produção; chaves `test_` operam em homologação.
    O passo a passo, com exemplos em cURL, PHP e JavaScript, está no guia do integrador (`docs/api/guia-do-integrador.md`).
servers:
  - url: https://api.exemplo.com.br
    description: Exemplo; use o endereço informado na tela de chaves de API.
security:
  - bearerAuth: []
tags:
  - name: Cadastros
    description: Clientes, produtos e serviços.
  - name: Notas
    description: Emissão, consulta, cancelamento e inutilização.
  - name: Webhooks
    description: Avisos de saída assinados.
  - name: Conta
    description: Dados da empresa e consumo do plano.
paths:
  /clientes:
    get:
      operationId: listarClientes
      tags: [Cadastros]
      summary: Listar clientes
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Busca'
        - $ref: '#/components/parameters/AtualizadoDesde'
      responses:
        '200':
          description: Página de resultados, ordenada por `(updated_at, id)` crescente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeClientes'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: criarCliente
      tags: [Cadastros]
      summary: Criar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClienteEntrada'}
            example: {tipo: PJ, nome: Exemplo Comércio Ltda, cpf_cnpj: "00.000.000/0001-00", email: contato@exemplo.com.br, uf: SP}
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeCliente'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /clientes/{id}:
    get:
      operationId: obterCliente
      tags: [Cadastros]
      summary: Obter cliente
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeCliente'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    put:
      operationId: atualizarCliente
      tags: [Cadastros]
      summary: Atualizar cliente
      description: Substitui os dados do registro; envie o corpo completo. Não há exclusão pela API (DELETE responde 405).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClienteEntrada'}
            example: {tipo: PJ, nome: Exemplo Comércio Ltda, cpf_cnpj: "00.000.000/0001-00", email: contato@exemplo.com.br, uf: SP}
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeCliente'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /produtos:
    get:
      operationId: listarProdutos
      tags: [Cadastros]
      summary: Listar produtos
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Busca'
        - $ref: '#/components/parameters/AtualizadoDesde'
      responses:
        '200':
          description: Página de resultados, ordenada por `(updated_at, id)` crescente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeProdutos'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: criarProduto
      tags: [Cadastros]
      summary: Criar produto
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProdutoEntrada'}
            example: {sku: PARAF-001, nome: Parafuso sextavado, unidade: UN, preco_centavos: 500, ncm: "73181500", origem: 0}
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeProduto'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /produtos/{id}:
    get:
      operationId: obterProduto
      tags: [Cadastros]
      summary: Obter produto
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeProduto'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    put:
      operationId: atualizarProduto
      tags: [Cadastros]
      summary: Atualizar produto
      description: Substitui os dados do registro; envie o corpo completo. Não há exclusão pela API (DELETE responde 405).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProdutoEntrada'}
            example: {sku: PARAF-001, nome: Parafuso sextavado, unidade: UN, preco_centavos: 500, ncm: "73181500", origem: 0}
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeProduto'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /servicos:
    get:
      operationId: listarServicos
      tags: [Cadastros]
      summary: Listar servicos
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Busca'
        - $ref: '#/components/parameters/AtualizadoDesde'
      responses:
        '200':
          description: Página de resultados, ordenada por `(updated_at, id)` crescente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeServicos'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: criarServico
      tags: [Cadastros]
      summary: Criar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServicoEntrada'}
            example: {nome: Consultoria, preco_centavos: 10000, codigo_lc116: "17.01", aliquota_iss: 2.5}
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeServico'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /servicos/{id}:
    get:
      operationId: obterServico
      tags: [Cadastros]
      summary: Obter serviço
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeServico'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    put:
      operationId: atualizarServico
      tags: [Cadastros]
      summary: Atualizar serviço
      description: Substitui os dados do registro; envie o corpo completo. Não há exclusão pela API (DELETE responde 405).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServicoEntrada'}
            example: {nome: Consultoria, preco_centavos: 10000, codigo_lc116: "17.01", aliquota_iss: 2.5}
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeServico'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas:
    get:
      operationId: listarNotas
      tags: [Notas]
      summary: Listar notas
      description: Lista as notas já emitidas (rascunhos do app não aparecem), da mais antiga alterada para a mais recente.
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/StatusDaNota'}}
        - {name: modelo, in: query, required: false, schema: {$ref: '#/components/schemas/ModeloDaNota'}}
        - {name: de, in: query, required: false, description: "Criadas a partir desta data (AAAA-MM-DD).", schema: {type: string, format: date}}
        - {name: ate, in: query, required: false, description: "Criadas até esta data (AAAA-MM-DD).", schema: {type: string, format: date}}
      responses:
        '200':
          description: Página de notas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeNotas'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: emitirNota
      tags: [Notas]
      summary: Emitir nota
      description: |
        Emite NF-e, NFC-e ou NFS-e. A resposta é `202`: a emissão continua em segundo plano;
        acompanhe por `GET /notas/{id}/status` ou por webhook (`nota.autorizada`, `nota.rejeitada`…).

        Chave `test_` emite em homologação e chave `live_` em produção; usar a chave do outro ambiente
        devolve `API_AMBIENTE_DIVERGENTE`. Clientes, produtos e serviços podem ser enviados inline e são
        cadastrados (ou reaproveitados) junto com a nota.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmissaoEntrada'}
            examples:
              nfe:
                summary: NF-e com cliente e produto existentes
                value:
                  modelo: NFE
                  cliente: {id: 0b6f2d8e-3b1c-4f6a-9d6e-8f1c2a3b4c5d}
                  desconto_centavos: 0
                  itens:
                    - {produto_id: 7c1f0a52-9e3d-4b7a-8a64-2d5e6f708192, quantidade: "2"}
                  pagamentos:
                    - {tpag: "01", valor_centavos: 10000}
              nfse:
                summary: NFS-e com serviço inline
                value:
                  modelo: DPS
                  cliente: {tipo: PJ, nome: Exemplo Comércio Ltda, cpf_cnpj: "00.000.000/0001-00"}
                  desconto_centavos: 0
                  itens:
                    - servico: {codigo: CONSULT-1, nome: Consultoria, preco_centavos: 20000, codigo_lc116: "17.01", c_trib_nac: "170101", aliquota_iss: "5"}
                      quantidade: "1"
      responses:
        '202':
          description: Emissão aceita; a nota nasce `PROCESSANDO`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeEmissao'}
        '400': {$ref: '#/components/responses/Idempotencia'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '403': {$ref: '#/components/responses/RegraDeNegocio'}
        '409': {$ref: '#/components/responses/Idempotencia'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas/{id}:
    get:
      operationId: obterNota
      tags: [Notas]
      summary: Obter nota
      description: Nota completa, com itens, pagamentos e histórico de eventos.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: A nota.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeNota'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas/{id}/status:
    get:
      operationId: obterStatusDaNota
      tags: [Notas]
      summary: Consultar o status da nota
      description: Resposta leve para acompanhar a emissão ou o cancelamento.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeNotaStatus'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas/{id}/pdf:
    get:
      operationId: baixarPdfDaNota
      tags: [Notas]
      summary: Baixar o PDF (DANFE, DANFE NFC-e ou DANFSe)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O PDF da nota.
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/RegraDeNegocio'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas/{id}/xml:
    get:
      operationId: baixarXmlDaNota
      tags: [Notas]
      summary: Baixar o XML autorizado
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O XML autorizado.
          content:
            application/xml:
              schema: {type: string}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/RegraDeNegocio'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas/{id}/xml-cancelamento:
    get:
      operationId: baixarXmlDeCancelamento
      tags: [Notas]
      summary: Baixar o XML do cancelamento
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O XML do evento de cancelamento.
          content:
            application/xml:
              schema: {type: string}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/RegraDeNegocio'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas/{id}/cancelar:
    post:
      operationId: cancelarNota
      tags: [Notas]
      summary: Cancelar nota
      description: Inicia o cancelamento (`202`). Acompanhe pelo status ou pelo webhook `nota.cancelada`. Se a SEFAZ recusar, a nota volta a `AUTORIZADA` com `cancelamento_motivo`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelamentoEntrada'}
            example: {justificativa: Cancelamento por erro de digitação do valor total}
      responses:
        '202':
          description: Cancelamento iniciado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeNotaStatus'}
        '400': {$ref: '#/components/responses/Idempotencia'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/RegraDeNegocio'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /notas/inutilizacoes:
    get:
      operationId: listarInutilizacoes
      tags: [Notas]
      summary: Listar inutilizações
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de inutilizações.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeInutilizacoes'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: inutilizarNumeracao
      tags: [Notas]
      summary: Inutilizar uma faixa de numeração
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InutilizacaoEntrada'}
            example: {serie: "1", numero_inicial: 3, numero_final: 5, justificativa: Numeração perdida por queda do servidor}
      responses:
        '201':
          description: Inutilização registrada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeInutilizacao'}
        '400': {$ref: '#/components/responses/Idempotencia'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '409': {$ref: '#/components/responses/RegraDeNegocio'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /webhooks:
    get:
      operationId: listarWebhooks
      tags: [Webhooks]
      summary: Listar webhooks
      description: Até 5 webhooks por empresa; a lista não é paginada.
      responses:
        '200':
          description: Os webhooks cadastrados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeWebhooks'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: criarWebhook
      tags: [Webhooks]
      summary: Criar webhook
      description: |
        Cadastra uma URL para receber os eventos de nota. A resposta traz o `segredo` (`whsec_…`) uma única vez.
        Esta operação **não** aceita `Idempotency-Key`, para o segredo não ficar guardado na tabela de idempotência.
        Falhas: `WEBHOOK_URL_INVALIDA` (422), `WEBHOOK_LIMITE_ATINGIDO` (422, máximo de 5), `MODULO_NAO_CONTRATADO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookEntrada'}
            example: {url: "https://seu-erp.exemplo.com.br/webhooks/fiscal", ambiente: HOMOLOGACAO, eventos: [nota.autorizada, nota.rejeitada], descricao: ERP}
      responses:
        '201':
          description: Criado, com o segredo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeWebhookComSegredo'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '403': {$ref: '#/components/responses/RegraDeNegocio'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /webhooks/{id}:
    get:
      operationId: obterWebhook
      tags: [Webhooks]
      summary: Obter webhook
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O webhook, sem o segredo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeWebhook'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    put:
      operationId: atualizarWebhook
      tags: [Webhooks]
      summary: Atualizar webhook
      description: "Atualização parcial. Para reativar um webhook desativado, envie `ativo: true`."
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookAtualizacao'}
            example: {ativo: true}
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeWebhook'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    delete:
      operationId: excluirWebhook
      tags: [Webhooks]
      summary: Excluir webhook
      description: Remove o webhook e o seu histórico de entregas.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Excluído.
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /webhooks/{id}/testar:
    post:
      operationId: testarWebhook
      tags: [Webhooks]
      summary: Enviar um evento de teste
      description: Envia `webhook.teste` agora. O teste não é retentado e não conta para a desativação automática. Webhook inativo responde `WEBHOOK_INATIVO` (409).
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Entrega criada e enviada; veja `tentativas_log`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeEntrega'}
        '400': {$ref: '#/components/responses/Idempotencia'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/RegraDeNegocio'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /webhooks/{id}/entregas:
    get:
      operationId: listarEntregasDoWebhook
      tags: [Webhooks]
      summary: Listar as entregas de um webhook
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de entregas, da mais recente para a mais antiga.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeEntregas'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /webhooks/entregas/{id}:
    get:
      operationId: obterEntregaDeWebhook
      tags: [Webhooks]
      summary: Obter uma entrega
      description: Inclui o `payload` enviado e o log de tentativas.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: A entrega.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeEntrega'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /webhooks/entregas/{id}/reenviar:
    post:
      operationId: reenviarEntregaDeWebhook
      tags: [Webhooks]
      summary: Reenviar uma entrega
      description: Abre uma nova rodada de retentativas (7 tentativas). Uma entrega ainda `PENDENTE` não muda. O `evento_id` e o corpo continuam os mesmos.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Reenvio aceito.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeEntrega'}
        '400': {$ref: '#/components/responses/Idempotencia'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/RegraDeNegocio'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /empresa:
    get:
      operationId: obterEmpresa
      tags: [Conta]
      summary: Dados da empresa
      description: Dados cadastrais e fiscais da empresa dona da chave, sem segredos (certificado e CSC nunca são devolvidos).
      responses:
        '200':
          description: A empresa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeEmpresa'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /consumo:
    get:
      operationId: obterConsumo
      tags: [Conta]
      summary: Consumo do plano
      description: Uso e limite de cada recurso do plano.
      responses:
        '200':
          description: Uso por recurso.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeConsumo'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
webhooks:
  notaAutorizada:
    post:
      operationId: receberNotaAutorizada
      tags: [Webhooks]
      summary: "nota.autorizada"
      description: |
        A nota foi autorizada. Também é enviado quando um cancelamento é recusado ou não confirmado e a nota volta a `AUTORIZADA` (veja `cancelamento_motivo` no recurso).

        Verifique `X-Signature` antes de confiar no corpo (veja o guia do integrador). Responda com qualquer status 2xx em até 10 segundos;
        qualquer outra resposta (inclusive redirecionamento) conta como falha e é retentada.
      parameters:
        - {name: X-Signature, in: header, required: true, description: "t=<unix>,v1=<hmac_sha256 hex de \"<t>.<corpo>\" com o segredo>.", schema: {type: string}}
        - {name: X-Webhook-Id, in: header, required: true, description: "Identificador estável do evento; use para deduplicar.", schema: {type: string}}
        - {name: X-Webhook-Event, in: header, required: true, description: "nota.autorizada", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventoDeNota'}
      responses:
        '200':
          description: Recebido.
  notaRejeitada:
    post:
      operationId: receberNotaRejeitada
      tags: [Webhooks]
      summary: "nota.rejeitada"
      description: |
        O órgão autorizador rejeitou a nota. `cstat` e `motivo` dizem o porquê.

        Verifique `X-Signature` antes de confiar no corpo (veja o guia do integrador). Responda com qualquer status 2xx em até 10 segundos;
        qualquer outra resposta (inclusive redirecionamento) conta como falha e é retentada.
      parameters:
        - {name: X-Signature, in: header, required: true, description: "t=<unix>,v1=<hmac_sha256 hex de \"<t>.<corpo>\" com o segredo>.", schema: {type: string}}
        - {name: X-Webhook-Id, in: header, required: true, description: "Identificador estável do evento; use para deduplicar.", schema: {type: string}}
        - {name: X-Webhook-Event, in: header, required: true, description: "nota.rejeitada", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventoDeNota'}
      responses:
        '200':
          description: Recebido.
  notaCancelada:
    post:
      operationId: receberNotaCancelada
      tags: [Webhooks]
      summary: "nota.cancelada"
      description: |
        O cancelamento foi homologado.

        Verifique `X-Signature` antes de confiar no corpo (veja o guia do integrador). Responda com qualquer status 2xx em até 10 segundos;
        qualquer outra resposta (inclusive redirecionamento) conta como falha e é retentada.
      parameters:
        - {name: X-Signature, in: header, required: true, description: "t=<unix>,v1=<hmac_sha256 hex de \"<t>.<corpo>\" com o segredo>.", schema: {type: string}}
        - {name: X-Webhook-Id, in: header, required: true, description: "Identificador estável do evento; use para deduplicar.", schema: {type: string}}
        - {name: X-Webhook-Event, in: header, required: true, description: "nota.cancelada", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventoDeNota'}
      responses:
        '200':
          description: Recebido.
  notaErro:
    post:
      operationId: receberNotaErro
      tags: [Webhooks]
      summary: "nota.erro"
      description: |
        A emissão falhou antes de uma resposta definitiva; veja `mensagem_erro`.

        Verifique `X-Signature` antes de confiar no corpo (veja o guia do integrador). Responda com qualquer status 2xx em até 10 segundos;
        qualquer outra resposta (inclusive redirecionamento) conta como falha e é retentada.
      parameters:
        - {name: X-Signature, in: header, required: true, description: "t=<unix>,v1=<hmac_sha256 hex de \"<t>.<corpo>\" com o segredo>.", schema: {type: string}}
        - {name: X-Webhook-Id, in: header, required: true, description: "Identificador estável do evento; use para deduplicar.", schema: {type: string}}
        - {name: X-Webhook-Event, in: header, required: true, description: "nota.erro", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventoDeNota'}
      responses:
        '200':
          description: Recebido.
  notaContingencia:
    post:
      operationId: receberNotaContingencia
      tags: [Webhooks]
      summary: "nota.contingencia"
      description: |
        A nota entrou em contingência (NFC-e offline ou EPEC) e será transmitida depois.

        Verifique `X-Signature` antes de confiar no corpo (veja o guia do integrador). Responda com qualquer status 2xx em até 10 segundos;
        qualquer outra resposta (inclusive redirecionamento) conta como falha e é retentada.
      parameters:
        - {name: X-Signature, in: header, required: true, description: "t=<unix>,v1=<hmac_sha256 hex de \"<t>.<corpo>\" com o segredo>.", schema: {type: string}}
        - {name: X-Webhook-Id, in: header, required: true, description: "Identificador estável do evento; use para deduplicar.", schema: {type: string}}
        - {name: X-Webhook-Event, in: header, required: true, description: "nota.contingencia", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventoDeNota'}
      responses:
        '200':
          description: Recebido.
  webhookTeste:
    post:
      operationId: receberWebhookTeste
      tags: [Webhooks]
      summary: webhook.teste
      description: Evento de teste, enviado pelo botão de teste da tela ou por `POST /webhooks/{id}/testar`. Não é retentado.
      parameters:
        - {name: X-Signature, in: header, required: true, schema: {type: string}}
        - {name: X-Webhook-Id, in: header, required: true, schema: {type: string}}
        - {name: X-Webhook-Event, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventoDeTeste'}
      responses:
        '200':
          description: Recebido.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Chave `live_…` (produção) ou `test_…` (homologação).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identifica a operação. Repetir a chave com o mesmo corpo devolve a resposta original por 24 horas.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limite:
      name: limite
      in: query
      required: false
      description: Itens por página, de 1 a 100 (padrão 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco; use o valor de `links.proxima` sem alterá-lo.
      schema:
        type: string
    Busca:
      name: q
      in: query
      required: false
      description: Busca por texto.
      schema:
        type: string
    AtualizadoDesde:
      name: atualizado_desde
      in: query
      required: false
      description: ISO-8601; só registros alterados desde então (inclusive).
      schema:
        type: string
        format: date-time
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  headers:
    X-RateLimit-Limit:
      description: Requisições permitidas na janela.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requisições restantes na janela.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Instante (Unix) em que a janela reinicia.
      schema:
        type: integer
    Retry-After:
      description: Segundos até poder tentar de novo.
      schema:
        type: integer
  schemas:
    CampoInvalido:
      type: object
      additionalProperties: false
      required: [campo, mensagem]
      properties:
        campo:
          type: string
        mensagem:
          type: string
    Problem:
      type: object
      description: Erro no formato RFC 9457. Erros de regra de negócio podem trazer campos extras (por exemplo `recurso` e `limite`).
      required: [type, title, status, detail, codigo, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          description: Código estável para tratamento em código.
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CampoInvalido'
    LinksDePagina:
      type: object
      additionalProperties: false
      required: [proxima]
      properties:
        proxima:
          type: ["string", "null"]
          description: URL da próxima página; nulo na última.
    MetaDePagina:
      type: object
      additionalProperties: false
      required: [limite]
      properties:
        limite:
          type: integer
    Contato:
      type: object
      additionalProperties: false
      required: [id, nome, cargo, email, telefone]
      properties:
        id: {type: string, format: uuid}
        nome: {type: string}
        cargo: {type: ["string", "null"]}
        email: {type: ["string", "null"]}
        telefone: {type: ["string", "null"]}
    Cliente:
      type: object
      additionalProperties: false
      required: [id, tipo, nome, cpf_cnpj, inscricao_estadual, ie_isento, email, telefone, logradouro, numero, bairro, cidade, uf, cep, codigo_ibge, tags, origem, estagio]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [PF, PJ]}
        nome: {type: string}
        cpf_cnpj: {type: ["string", "null"], description: "Somente dígitos."}
        inscricao_estadual: {type: ["string", "null"]}
        ie_isento: {type: boolean}
        email: {type: ["string", "null"]}
        telefone: {type: ["string", "null"]}
        logradouro: {type: ["string", "null"]}
        numero: {type: ["string", "null"]}
        bairro: {type: ["string", "null"]}
        cidade: {type: ["string", "null"]}
        uf: {type: ["string", "null"]}
        cep: {type: ["string", "null"]}
        codigo_ibge: {type: ["string", "null"]}
        tags: {type: array, items: {type: string}}
        origem: {type: ["string", "null"]}
        estagio: {type: string, enum: [LEAD, CLIENTE]}
        contatos:
          type: array
          description: Presente apenas ao consultar um cliente pelo id.
          items: {$ref: '#/components/schemas/Contato'}
    ClienteEntrada:
      type: object
      required: [tipo, nome]
      properties:
        tipo: {type: string, enum: [PF, PJ]}
        nome: {type: string, maxLength: 150}
        cpf_cnpj: {type: ["string", "null"], description: "CPF (PF) ou CNPJ (PJ) válido; único por empresa. Pontuação é aceita."}
        inscricao_estadual: {type: ["string", "null"], maxLength: 20}
        ie_isento: {type: boolean}
        email: {type: ["string", "null"], format: email, maxLength: 150}
        telefone: {type: ["string", "null"], maxLength: 20}
        logradouro: {type: ["string", "null"], maxLength: 150}
        numero: {type: ["string", "null"], maxLength: 20}
        bairro: {type: ["string", "null"], maxLength: 100}
        cidade: {type: ["string", "null"], maxLength: 100}
        uf: {type: ["string", "null"], minLength: 2, maxLength: 2}
        cep: {type: ["string", "null"]}
        codigo_ibge: {type: ["string", "null"]}
        tags: {type: array, items: {type: string, maxLength: 30}}
        origem: {type: ["string", "null"], maxLength: 60}
        estagio: {type: ["string", "null"], enum: [LEAD, CLIENTE, null]}
    Produto:
      type: object
      additionalProperties: false
      required: [id, sku, nome, unidade, preco_centavos, gtin, ncm, cest, origem, tributacao_icms, fiscal_fonte, fiscal_revisado_em, pendente_fiscal]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        nome: {type: string}
        unidade: {type: string}
        preco_centavos: {type: integer, description: "Preço em centavos."}
        gtin: {type: ["string", "null"]}
        ncm: {type: ["string", "null"]}
        cest: {type: ["string", "null"]}
        origem: {type: ["string", "integer", "null"], description: "Origem da mercadoria (0 a 8). Zero é um valor válido (nacional)."}
        tributacao_icms: {type: ["string", "null"], enum: [NORMAL, ST, null]}
        fiscal_fonte: {type: string}
        fiscal_revisado_em: {type: ["string", "null"], format: date-time}
        pendente_fiscal: {type: boolean, description: "Verdadeiro enquanto faltarem dados fiscais; a emissão é bloqueada."}
    ProdutoEntrada:
      type: object
      required: [sku, nome, unidade, preco_centavos]
      properties:
        sku: {type: string, maxLength: 60, description: "Único por empresa."}
        nome: {type: string, maxLength: 150}
        unidade: {type: string, maxLength: 10}
        preco_centavos: {type: integer, minimum: 0}
        gtin: {type: ["string", "null"], maxLength: 14}
        ncm: {type: ["string", "null"]}
        cest: {type: ["string", "null"]}
        origem: {type: ["string", "integer", "null"], description: "Dígito de 0 a 8."}
        tributacao_icms: {type: ["string", "null"], enum: [NORMAL, ST, null]}
    Servico:
      type: object
      additionalProperties: false
      required: [id, codigo, nome, preco_centavos, codigo_lc116, c_trib_nac, codigo_municipal, aliquota_iss, nbs, pendente_fiscal]
      properties:
        id: {type: string, format: uuid}
        codigo: {type: ["string", "null"]}
        nome: {type: string}
        preco_centavos: {type: integer}
        codigo_lc116: {type: ["string", "null"], description: "Formato 00.00."}
        c_trib_nac: {type: ["string", "null"], description: "Seis dígitos."}
        codigo_municipal: {type: ["string", "null"], description: "Três dígitos."}
        aliquota_iss: {type: ["number", "string", "null"], description: "Percentual de 0 a 100."}
        nbs: {type: ["string", "null"]}
        pendente_fiscal: {type: boolean}
    ServicoEntrada:
      type: object
      required: [nome, preco_centavos]
      properties:
        codigo: {type: ["string", "null"], maxLength: 60, description: "Único por empresa."}
        nome: {type: string, maxLength: 150}
        preco_centavos: {type: integer, minimum: 0}
        codigo_lc116: {type: ["string", "null"], pattern: '^\d{2}\.\d{2}$'}
        c_trib_nac: {type: ["string", "null"], pattern: '^\d{6}$'}
        codigo_municipal: {type: ["string", "null"], pattern: '^\d{3}$'}
        aliquota_iss: {type: ["number", "null"], minimum: 0, maximum: 100}
        nbs: {type: ["string", "null"], maxLength: 9}
    Empresa:
      type: object
      additionalProperties: false
      required: [razao_social, nome_fantasia, cnpj, logradouro, numero, bairro, cidade, uf, cep, codigo_ibge, regime_tributario, inscricao_estadual, inscricao_municipal, cnae, ambiente_fiscal, certificado_status, certificado_validade, ambiente_da_chave]
      properties:
        razao_social: {type: ["string", "null"]}
        nome_fantasia: {type: ["string", "null"]}
        cnpj: {type: ["string", "null"]}
        logradouro: {type: ["string", "null"]}
        numero: {type: ["string", "null"]}
        bairro: {type: ["string", "null"]}
        cidade: {type: ["string", "null"]}
        uf: {type: ["string", "null"]}
        cep: {type: ["string", "null"]}
        codigo_ibge: {type: ["string", "null"]}
        regime_tributario: {type: ["string", "null"]}
        inscricao_estadual: {type: ["string", "null"]}
        inscricao_municipal: {type: ["string", "null"]}
        cnae: {type: ["string", "null"]}
        ambiente_fiscal: {type: ["string", "null"], description: "Ambiente de emissão configurado na empresa."}
        certificado_status: {type: ["string", "null"]}
        certificado_validade: {type: ["string", "null"], format: date}
        ambiente_da_chave: {type: string, enum: [live, test], description: "Ambiente da chave usada na requisição."}
    ConsumoItem:
      type: object
      additionalProperties: false
      required: [recurso, uso, limite]
      properties:
        recurso: {type: string}
        uso: {type: integer}
        limite: {type: integer, description: "-1 quando ilimitado."}
    RespostaDeEmpresa:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Empresa'}
    RespostaDeConsumo:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ConsumoItem'}}
    RespostaDeCliente:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Cliente'}
    ListaDeClientes:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Cliente'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
    RespostaDeProduto:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Produto'}
    ListaDeProdutos:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Produto'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
    RespostaDeServico:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Servico'}
    ListaDeServicos:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Servico'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
    StatusDaNota:
      type: string
      enum: [PROCESSANDO, AUTORIZADA, REJEITADA, ERRO, CANCELADA, CANCELANDO, CONTINGENCIA]
      description: Estado da nota. `PROCESSANDO`, `CANCELANDO` e `CONTINGENCIA` ainda mudam; os demais são finais (exceto reenvio pelo app).
    ModeloDaNota:
      type: string
      enum: [NFE, NFCE, DPS]
      description: NF-e, NFC-e ou NFS-e (DPS).
    ItemDaNota:
      type: object
      additionalProperties: false
      required: [id, produto_id, ordem, sku, descricao, unidade, quantidade, valor_unitario_centavos, desconto_centavos, total_centavos, cfop, csosn, servico_id, c_trib_nac, codigo_municipal, aliquota_iss, nbs]
      properties:
        id: {type: ["integer", "string"]}
        produto_id: {type: ["string", "null"]}
        ordem: {type: integer}
        sku: {type: ["string", "null"]}
        descricao: {type: ["string", "null"]}
        unidade: {type: ["string", "null"]}
        quantidade: {type: string, description: "Decimal com até 3 casas, como texto."}
        valor_unitario_centavos: {type: integer}
        desconto_centavos: {type: ["integer", "null"]}
        total_centavos: {type: integer}
        cfop: {type: ["string", "null"]}
        csosn: {type: ["string", "null"]}
        servico_id: {type: ["string", "null"]}
        c_trib_nac: {type: ["string", "null"]}
        codigo_municipal: {type: ["string", "null"]}
        aliquota_iss: {type: ["number", "string", "null"]}
        nbs: {type: ["string", "null"]}
    PagamentoDaNota:
      type: object
      additionalProperties: false
      required: [tpag, xpag, valor_centavos]
      properties:
        tpag: {type: string, enum: ["01", "03", "04", "17", "99"], description: "01 dinheiro, 03 crédito, 04 débito, 17 PIX, 99 outros."}
        xpag: {type: ["string", "null"]}
        valor_centavos: {type: integer}
    EventoDaNota:
      type: object
      additionalProperties: false
      required: [status_de, status_para, detalhe, em]
      properties:
        status_de: {type: ["string", "null"]}
        status_para: {type: string}
        detalhe: {type: ["string", "null"]}
        em: {type: string, format: date-time}
    Nota:
      type: object
      additionalProperties: false
      required: [id, modelo, status, ambiente, numero, serie, chave, protocolo, numero_nfse, venda_id, cstat, motivo, mensagem_erro, natureza_operacao, consumidor_final, subtotal_centavos, desconto_centavos, total_centavos, informacoes_complementares, emitido_em, contingencia_limite_em, contingencia_motivo, contingencia_tipo, epec_protocolo, epec_registrado_em, cancelamento_justificativa, cancelado_em, cancelamento_protocolo, cancelamento_cstat, cancelamento_motivo, created_at]
      properties:
        id: {type: string, format: uuid}
        modelo: {$ref: '#/components/schemas/ModeloDaNota'}
        status: {$ref: '#/components/schemas/StatusDaNota'}
        ambiente: {type: ["string", "null"], enum: [HOMOLOGACAO, PRODUCAO, null]}
        numero: {type: ["integer", "null"]}
        serie: {type: ["string", "null"]}
        chave: {type: ["string", "null"], description: "Chave de acesso (44 dígitos na NF-e/NFC-e; 50 na NFS-e)."}
        protocolo: {type: ["string", "null"]}
        numero_nfse: {type: ["string", "null"]}
        venda_id: {type: ["string", "null"]}
        cstat: {type: ["string", "null"], description: "Código de retorno da SEFAZ ou da ADN."}
        motivo: {type: ["string", "null"], description: "Mensagem do órgão autorizador."}
        mensagem_erro: {type: ["string", "null"]}
        natureza_operacao: {type: ["string", "null"]}
        consumidor_final: {type: ["boolean", "null"]}
        subtotal_centavos: {type: integer}
        desconto_centavos: {type: integer}
        total_centavos: {type: integer}
        informacoes_complementares: {type: ["string", "null"]}
        emitido_em: {type: ["string", "null"], format: date-time}
        contingencia_limite_em: {type: ["string", "null"], format: date-time}
        contingencia_motivo: {type: ["string", "null"]}
        contingencia_tipo: {type: ["string", "null"], enum: [OFFLINE_NFCE, EPEC, null]}
        epec_protocolo: {type: ["string", "null"]}
        epec_registrado_em: {type: ["string", "null"], format: date-time}
        cancelamento_justificativa: {type: ["string", "null"]}
        cancelado_em: {type: ["string", "null"], format: date-time}
        cancelamento_protocolo: {type: ["string", "null"]}
        cancelamento_cstat: {type: ["string", "null"]}
        cancelamento_motivo: {type: ["string", "null"], description: "Motivo da recusa quando o cancelamento não foi aceito; nesse caso a nota volta a `AUTORIZADA`."}
        created_at: {type: string, format: date-time}
        cliente:
          type: ["object", "null"]
          description: Presente nas listas e na consulta de uma nota.
          additionalProperties: false
          properties:
            id: {type: string, format: uuid}
            nome: {type: string}
        itens:
          type: array
          description: Presente apenas ao consultar a nota pelo id.
          items: {$ref: '#/components/schemas/ItemDaNota'}
        pagamentos:
          type: array
          description: Presente apenas ao consultar a nota pelo id.
          items: {$ref: '#/components/schemas/PagamentoDaNota'}
        eventos:
          type: array
          description: Histórico de transições; presente apenas ao consultar a nota pelo id.
          items: {$ref: '#/components/schemas/EventoDaNota'}
    NotaStatus:
      type: object
      additionalProperties: false
      required: [id, status, numero, serie, chave, cstat, motivo, mensagem_erro, cancelamento_cstat, cancelamento_motivo]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/StatusDaNota'}
        numero: {type: ["integer", "null"]}
        serie: {type: ["string", "null"]}
        chave: {type: ["string", "null"]}
        cstat: {type: ["string", "null"]}
        motivo: {type: ["string", "null"]}
        mensagem_erro: {type: ["string", "null"]}
        cancelamento_cstat: {type: ["string", "null"]}
        cancelamento_motivo: {type: ["string", "null"]}
    EmissaoAceita:
      type: object
      additionalProperties: false
      required: [id, modelo, status]
      properties:
        id: {type: string, format: uuid}
        modelo: {$ref: '#/components/schemas/ModeloDaNota'}
        status: {$ref: '#/components/schemas/StatusDaNota'}
    ProdutoInline:
      type: object
      description: Produto cadastrado junto com a emissão. Se o `sku` já existir, o cadastro existente é reaproveitado.
      required: [sku]
      properties:
        sku: {type: string, maxLength: 60}
        nome: {type: string, maxLength: 150}
        unidade: {type: string, maxLength: 10}
        preco_centavos: {type: integer, minimum: 0}
        gtin: {type: ["string", "null"], maxLength: 14}
        ncm: {type: ["string", "null"]}
        cest: {type: ["string", "null"]}
        origem: {type: ["string", "integer", "null"]}
        tributacao_icms: {type: ["string", "null"], enum: [NORMAL, ST, null]}
    ServicoInline:
      type: object
      description: Serviço cadastrado junto com a emissão. Se o `codigo` já existir, o cadastro existente é reaproveitado.
      required: [codigo]
      properties:
        codigo: {type: string, maxLength: 60}
        nome: {type: string, maxLength: 150}
        preco_centavos: {type: integer, minimum: 0}
        codigo_lc116: {type: ["string", "null"], pattern: '^\d{2}\.\d{2}$'}
        c_trib_nac: {type: ["string", "null"], pattern: '^\d{6}$'}
        codigo_municipal: {type: ["string", "null"], pattern: '^\d{3}$'}
        aliquota_iss: {type: ["number", "string", "null"]}
        nbs: {type: ["string", "null"], maxLength: 9}
    ClienteDaNota:
      type: object
      description: Informe só `id` (cliente existente) ou só os dados do cliente, com `cpf_cnpj`. Na NFC-e o cliente é opcional.
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [PF, PJ]}
        nome: {type: string, maxLength: 150}
        cpf_cnpj: {type: string}
        inscricao_estadual: {type: ["string", "null"], maxLength: 20}
        ie_isento: {type: boolean}
        email: {type: ["string", "null"], maxLength: 150}
        telefone: {type: ["string", "null"], maxLength: 20}
        logradouro: {type: ["string", "null"], maxLength: 150}
        numero: {type: ["string", "null"], maxLength: 20}
        bairro: {type: ["string", "null"], maxLength: 100}
        cidade: {type: ["string", "null"], maxLength: 100}
        uf: {type: ["string", "null"], minLength: 2, maxLength: 2}
        cep: {type: ["string", "null"]}
        codigo_ibge: {type: ["string", "null"]}
    ItemDeEmissao:
      type: object
      description: Informe exatamente um entre `produto_id`, `produto`, `servico_id` e `servico`. Produtos valem para NF-e e NFC-e; serviços, para NFS-e (`DPS`).
      required: [quantidade]
      properties:
        produto_id: {type: string, format: uuid}
        servico_id: {type: string, format: uuid}
        produto: {$ref: '#/components/schemas/ProdutoInline'}
        servico: {$ref: '#/components/schemas/ServicoInline'}
        quantidade: {type: string, pattern: '^\d{1,9}(\.\d{1,3})?$', description: "Decimal com até 3 casas, como texto."}
        valor_unitario_centavos: {type: ["integer", "null"], minimum: 0, description: "Se omitido, usa o preço do cadastro."}
    PagamentoDeEmissao:
      type: object
      required: [tpag, valor_centavos]
      properties:
        tpag: {type: string, enum: ["01", "03", "04", "17", "99"]}
        xpag: {type: ["string", "null"], maxLength: 60}
        valor_centavos: {type: integer, minimum: 1}
    EmissaoEntrada:
      type: object
      required: [itens, desconto_centavos]
      properties:
        modelo: {$ref: '#/components/schemas/ModeloDaNota', description: "Padrão NFE."}
        cliente: {$ref: '#/components/schemas/ClienteDaNota'}
        consumidor_final: {type: ["boolean", "null"]}
        desconto_centavos: {type: integer, minimum: 0}
        informacoes_complementares: {type: ["string", "null"], maxLength: 5000}
        itens:
          type: array
          minItems: 1
          maxItems: 990
          items: {$ref: '#/components/schemas/ItemDeEmissao'}
        pagamentos:
          type: array
          minItems: 1
          description: Obrigatório em NF-e e NFC-e; proibido em NFS-e (`DPS`).
          items: {$ref: '#/components/schemas/PagamentoDeEmissao'}
    CancelamentoEntrada:
      type: object
      required: [justificativa]
      properties:
        justificativa: {type: string, minLength: 15, maxLength: 255}
    Inutilizacao:
      type: object
      additionalProperties: false
      required: [id, modelo, serie, numero_inicial, numero_final, justificativa, ambiente, status, cstat, motivo, protocolo, created_at]
      properties:
        id: {type: string, format: uuid}
        modelo: {type: string, enum: [NFE, NFCE]}
        serie: {type: string}
        numero_inicial: {type: integer}
        numero_final: {type: integer}
        justificativa: {type: string}
        ambiente: {type: ["string", "null"], enum: [HOMOLOGACAO, PRODUCAO, null]}
        status: {type: string, enum: [INUTILIZADA, RECUSADA, ERRO]}
        cstat: {type: ["string", "null"]}
        motivo: {type: ["string", "null"]}
        protocolo: {type: ["string", "null"]}
        created_at: {type: string, format: date-time}
    InutilizacaoEntrada:
      type: object
      required: [serie, numero_inicial, numero_final, justificativa]
      properties:
        modelo: {type: string, enum: [NFE, NFCE], description: "Padrão NFE."}
        serie: {type: string, pattern: '^\d{1,3}$'}
        numero_inicial: {type: integer, minimum: 1}
        numero_final: {type: integer, minimum: 1}
        justificativa: {type: string, minLength: 15, maxLength: 255}
    RespostaDeEmissao:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/EmissaoAceita'}
    RespostaDeNota:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Nota'}
    RespostaDeNotaStatus:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/NotaStatus'}
    ListaDeNotas:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Nota'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
    RespostaDeInutilizacao:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Inutilizacao'}
    ListaDeInutilizacoes:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Inutilizacao'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
    EventoDeWebhook:
      type: string
      enum: [nota.autorizada, nota.rejeitada, nota.cancelada, nota.erro, nota.contingencia]
    Webhook:
      type: object
      additionalProperties: false
      required: [id, url, descricao, eventos, ambiente, ativo, desativado_em, motivo_desativacao, segredo_final, criado_em]
      properties:
        id: {type: string, format: uuid}
        url: {type: string}
        descricao: {type: ["string", "null"]}
        eventos:
          type: ["array", "null"]
          items: {$ref: '#/components/schemas/EventoDeWebhook'}
          description: Eventos assinados; nulo significa todos.
        ambiente: {type: string, enum: [HOMOLOGACAO, PRODUCAO], description: "Só recebe eventos de notas deste ambiente."}
        ativo: {type: boolean}
        desativado_em: {type: ["string", "null"], format: date-time}
        motivo_desativacao: {type: ["string", "null"], description: "Preenchido quando o webhook é desativado por falhas seguidas (10 entregas sem sucesso)."}
        segredo_final: {type: string, description: "Últimos 4 caracteres do segredo, para identificá-lo."}
        criado_em: {type: ["string", "null"], format: date-time}
    WebhookComSegredo:
      type: object
      additionalProperties: false
      required: [id, url, descricao, eventos, ambiente, ativo, desativado_em, motivo_desativacao, segredo_final, criado_em, segredo]
      description: Resposta da criação. O `segredo` (`whsec_…`) aparece só aqui; guarde-o, ele não pode ser consultado depois.
      properties:
        id: {type: string, format: uuid}
        url: {type: string}
        descricao: {type: ["string", "null"]}
        eventos:
          type: ["array", "null"]
          items: {$ref: '#/components/schemas/EventoDeWebhook'}
        ambiente: {type: string, enum: [HOMOLOGACAO, PRODUCAO]}
        ativo: {type: boolean}
        desativado_em: {type: ["string", "null"], format: date-time}
        motivo_desativacao: {type: ["string", "null"]}
        segredo_final: {type: string}
        criado_em: {type: ["string", "null"], format: date-time}
        segredo: {type: string}
    WebhookEntrada:
      type: object
      required: [url, ambiente]
      properties:
        url: {type: string, description: "URL https pública. Endereços internos, credenciais na URL e hosts que resolvem para IP privado são recusados (`WEBHOOK_URL_INVALIDA`)."}
        descricao: {type: ["string", "null"], maxLength: 80}
        eventos:
          type: ["array", "null"]
          items: {$ref: '#/components/schemas/EventoDeWebhook'}
          description: Omitido ou nulo = todos os eventos de nota.
        ambiente: {type: string, enum: [HOMOLOGACAO, PRODUCAO]}
        ativo: {type: boolean, description: "Reativar um webhook desativado por falhas seguidas zera o contador."}
    WebhookAtualizacao:
      type: object
      description: Todos os campos são opcionais; só os enviados mudam. O segredo não muda.
      properties:
        url: {type: string}
        descricao: {type: ["string", "null"], maxLength: 80}
        eventos:
          type: ["array", "null"]
          items: {$ref: '#/components/schemas/EventoDeWebhook'}
        ambiente: {type: string, enum: [HOMOLOGACAO, PRODUCAO]}
        ativo: {type: boolean}
    TentativaDeEntrega:
      type: object
      additionalProperties: false
      required: [numero, status_http, duracao_ms, erro, resposta, em]
      properties:
        numero: {type: integer}
        status_http: {type: ["integer", "null"]}
        duracao_ms: {type: integer}
        erro: {type: ["string", "null"]}
        resposta: {type: ["string", "null"], description: "Início da resposta do seu servidor (até 1 KB)."}
        em: {type: string, format: date-time}
    Entrega:
      type: object
      additionalProperties: false
      required: [id, webhook_id, nota_id, evento, evento_id, estado, tentativas, proxima_tentativa_em, entregue_em, criada_em]
      properties:
        id: {type: string, format: uuid}
        webhook_id: {type: string, format: uuid}
        nota_id: {type: ["string", "null"]}
        evento: {type: string, description: "Um dos eventos de nota ou `webhook.teste`."}
        evento_id: {type: string, description: "Identificador estável do evento; igual ao cabeçalho `X-Webhook-Id`. Use para deduplicar."}
        estado: {type: string, enum: [PENDENTE, ENTREGUE, FALHOU]}
        tentativas: {type: integer}
        proxima_tentativa_em: {type: ["string", "null"], format: date-time}
        entregue_em: {type: ["string", "null"], format: date-time}
        criada_em: {type: string, format: date-time}
        tentativas_log:
          type: array
          description: Presente ao testar e ao reenviar.
          items: {$ref: '#/components/schemas/TentativaDeEntrega'}
        payload:
          type: object
          description: Corpo enviado ao seu servidor (veja `EventoDeNota` e `EventoDeTeste`). Presente ao consultar uma entrega, testar e reenviar.
    EventoDeNota:
      type: object
      additionalProperties: false
      description: Corpo enviado por POST ao seu servidor nos eventos de nota.
      required: [id, tipo, criado_em, ambiente, data]
      properties:
        id: {type: string, description: "Igual a `X-Webhook-Id`; estável entre retentativas."}
        tipo: {$ref: '#/components/schemas/EventoDeWebhook'}
        criado_em: {type: string, format: date-time}
        ambiente: {type: ["string", "null"], enum: [HOMOLOGACAO, PRODUCAO, null]}
        data:
          type: object
          additionalProperties: false
          required: [nota]
          properties:
            nota: {$ref: '#/components/schemas/Nota'}
    EventoDeTeste:
      type: object
      additionalProperties: false
      description: Corpo do evento `webhook.teste`, enviado pelo botão de teste ou por `POST /webhooks/{id}/testar`.
      required: [id, tipo, criado_em, ambiente, data]
      properties:
        id: {type: string}
        tipo: {type: string, enum: [webhook.teste]}
        criado_em: {type: string, format: date-time}
        ambiente: {type: string, enum: [HOMOLOGACAO, PRODUCAO]}
        data:
          type: object
          additionalProperties: false
          required: [mensagem]
          properties:
            mensagem: {type: string}
    RespostaDeWebhook:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Webhook'}
    RespostaDeWebhookComSegredo:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/WebhookComSegredo'}
    ListaDeWebhooks:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Webhook'}}
    RespostaDeEntrega:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Entrega'}
    ListaDeEntregas:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Entrega'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
  responses:
    NaoAutenticado:
      description: Chave ausente, inválida ou revogada (`API_CHAVE_AUSENTE`, `API_CHAVE_INVALIDA`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NaoEncontrado:
      description: O recurso não existe ou pertence a outra empresa (`RECURSO_NAO_ENCONTRADO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Validacao:
      description: Dados inválidos (`VALIDACAO`, com `errors[]`) ou cursor inválido (`CURSOR_INVALIDO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Idempotencia:
      description: |
        Problema de idempotência. `IDEMPOTENCY_KEY_AUSENTE` ou `IDEMPOTENCY_KEY_INVALIDA` (400);
        `IDEMPOTENCIA_EM_ANDAMENTO` (409, a primeira chamada ainda não terminou; traz `Retry-After` e, se já houver, `nota_id`);
        `IDEMPOTENCIA_CORPO_DIFERENTE` (409, a chave já foi usada com outro corpo ou endereço).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RegraDeNegocio:
      description: Regra de negócio não atendida; o `codigo` diz qual (por exemplo `CANCELAMENTO_NAO_PERMITIDO`, `LIMITE_DO_PLANO`, `MODULO_NAO_CONTRATADO`, `API_AMBIENTE_DIVERGENTE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LimiteExcedido:
      description: Limite de requisições da chave excedido (`API_LIMITE_EXCEDIDO`).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
