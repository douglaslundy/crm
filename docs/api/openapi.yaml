openapi: 3.1.0
info:
  title: API da Plataforma Fiscal
  version: 1.0.0
  description: |
    API pública para emitir NF-e, NFC-e e NFS-e e gerenciar cadastros e webhooks.

    Autenticação por chave `Authorization: Bearer <chave>`. Chaves `live_` operam em produção; chaves `test_` operam em homologação.
    O passo a passo, com exemplos em cURL, PHP e JavaScript, está no guia do integrador (`docs/api/guia-do-integrador.md`).
servers:
  - url: https://api.exemplo.com.br
    description: Exemplo; use o endereço informado na tela de chaves de API.
security:
  - bearerAuth: []
tags:
  - name: Cadastros
    description: Clientes, produtos e serviços.
  - name: Notas
    description: Emissão, consulta, cancelamento e inutilização.
  - name: Webhooks
    description: Avisos de saída assinados.
  - name: Conta
    description: Dados da empresa e consumo do plano.
paths:
  /clientes:
    get:
      operationId: listarClientes
      tags: [Cadastros]
      summary: Listar clientes
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Busca'
        - $ref: '#/components/parameters/AtualizadoDesde'
      responses:
        '200':
          description: Página de resultados, ordenada por `(updated_at, id)` crescente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeClientes'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: criarCliente
      tags: [Cadastros]
      summary: Criar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClienteEntrada'}
            example: {tipo: PJ, nome: Exemplo Comércio Ltda, cpf_cnpj: "00.000.000/0001-00", email: contato@exemplo.com.br, uf: SP}
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeCliente'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /clientes/{id}:
    get:
      operationId: obterCliente
      tags: [Cadastros]
      summary: Obter cliente
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeCliente'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    put:
      operationId: atualizarCliente
      tags: [Cadastros]
      summary: Atualizar cliente
      description: Substitui os dados do registro; envie o corpo completo. Não há exclusão pela API (DELETE responde 405).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClienteEntrada'}
            example: {tipo: PJ, nome: Exemplo Comércio Ltda, cpf_cnpj: "00.000.000/0001-00", email: contato@exemplo.com.br, uf: SP}
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeCliente'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /produtos:
    get:
      operationId: listarProdutos
      tags: [Cadastros]
      summary: Listar produtos
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Busca'
        - $ref: '#/components/parameters/AtualizadoDesde'
      responses:
        '200':
          description: Página de resultados, ordenada por `(updated_at, id)` crescente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeProdutos'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: criarProduto
      tags: [Cadastros]
      summary: Criar produto
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProdutoEntrada'}
            example: {sku: PARAF-001, nome: Parafuso sextavado, unidade: UN, preco_centavos: 500, ncm: "73181500", origem: 0}
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeProduto'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /produtos/{id}:
    get:
      operationId: obterProduto
      tags: [Cadastros]
      summary: Obter produto
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeProduto'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    put:
      operationId: atualizarProduto
      tags: [Cadastros]
      summary: Atualizar produto
      description: Substitui os dados do registro; envie o corpo completo. Não há exclusão pela API (DELETE responde 405).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProdutoEntrada'}
            example: {sku: PARAF-001, nome: Parafuso sextavado, unidade: UN, preco_centavos: 500, ncm: "73181500", origem: 0}
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeProduto'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /servicos:
    get:
      operationId: listarServicos
      tags: [Cadastros]
      summary: Listar servicos
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Busca'
        - $ref: '#/components/parameters/AtualizadoDesde'
      responses:
        '200':
          description: Página de resultados, ordenada por `(updated_at, id)` crescente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListaDeServicos'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    post:
      operationId: criarServico
      tags: [Cadastros]
      summary: Criar serviço
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServicoEntrada'}
            example: {nome: Consultoria, preco_centavos: 10000, codigo_lc116: "17.01", aliquota_iss: 2.5}
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeServico'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /servicos/{id}:
    get:
      operationId: obterServico
      tags: [Cadastros]
      summary: Obter serviço
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: O registro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeServico'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
    put:
      operationId: atualizarServico
      tags: [Cadastros]
      summary: Atualizar serviço
      description: Substitui os dados do registro; envie o corpo completo. Não há exclusão pela API (DELETE responde 405).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServicoEntrada'}
            example: {nome: Consultoria, preco_centavos: 10000, codigo_lc116: "17.01", aliquota_iss: 2.5}
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeServico'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '422': {$ref: '#/components/responses/Validacao'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /empresa:
    get:
      operationId: obterEmpresa
      tags: [Conta]
      summary: Dados da empresa
      description: Dados cadastrais e fiscais da empresa dona da chave, sem segredos (certificado e CSC nunca são devolvidos).
      responses:
        '200':
          description: A empresa.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeEmpresa'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
  /consumo:
    get:
      operationId: obterConsumo
      tags: [Conta]
      summary: Consumo do plano
      description: Uso e limite de cada recurso do plano.
      responses:
        '200':
          description: Uso por recurso.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaDeConsumo'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '429': {$ref: '#/components/responses/LimiteExcedido'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Chave `live_…` (produção) ou `test_…` (homologação).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identifica a operação. Repetir a chave com o mesmo corpo devolve a resposta original por 24 horas.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limite:
      name: limite
      in: query
      required: false
      description: Itens por página, de 1 a 100 (padrão 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco; use o valor de `links.proxima` sem alterá-lo.
      schema:
        type: string
    Busca:
      name: q
      in: query
      required: false
      description: Busca por texto.
      schema:
        type: string
    AtualizadoDesde:
      name: atualizado_desde
      in: query
      required: false
      description: ISO-8601; só registros alterados desde então (inclusive).
      schema:
        type: string
        format: date-time
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  headers:
    X-RateLimit-Limit:
      description: Requisições permitidas na janela.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requisições restantes na janela.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Instante (Unix) em que a janela reinicia.
      schema:
        type: integer
    Retry-After:
      description: Segundos até poder tentar de novo.
      schema:
        type: integer
  schemas:
    CampoInvalido:
      type: object
      additionalProperties: false
      required: [campo, mensagem]
      properties:
        campo:
          type: string
        mensagem:
          type: string
    Problem:
      type: object
      description: Erro no formato RFC 9457. Erros de regra de negócio podem trazer campos extras (por exemplo `recurso` e `limite`).
      required: [type, title, status, detail, codigo, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          description: Código estável para tratamento em código.
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CampoInvalido'
    LinksDePagina:
      type: object
      additionalProperties: false
      required: [proxima]
      properties:
        proxima:
          type: ["string", "null"]
          description: URL da próxima página; nulo na última.
    MetaDePagina:
      type: object
      additionalProperties: false
      required: [limite]
      properties:
        limite:
          type: integer
    Contato:
      type: object
      additionalProperties: false
      required: [id, nome, cargo, email, telefone]
      properties:
        id: {type: string, format: uuid}
        nome: {type: string}
        cargo: {type: ["string", "null"]}
        email: {type: ["string", "null"]}
        telefone: {type: ["string", "null"]}
    Cliente:
      type: object
      additionalProperties: false
      required: [id, tipo, nome, cpf_cnpj, inscricao_estadual, ie_isento, email, telefone, logradouro, numero, bairro, cidade, uf, cep, codigo_ibge, tags, origem, estagio]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [PF, PJ]}
        nome: {type: string}
        cpf_cnpj: {type: ["string", "null"], description: Somente dígitos.}
        inscricao_estadual: {type: ["string", "null"]}
        ie_isento: {type: boolean}
        email: {type: ["string", "null"]}
        telefone: {type: ["string", "null"]}
        logradouro: {type: ["string", "null"]}
        numero: {type: ["string", "null"]}
        bairro: {type: ["string", "null"]}
        cidade: {type: ["string", "null"]}
        uf: {type: ["string", "null"]}
        cep: {type: ["string", "null"]}
        codigo_ibge: {type: ["string", "null"]}
        tags: {type: array, items: {type: string}}
        origem: {type: ["string", "null"]}
        estagio: {type: string, enum: [LEAD, CLIENTE]}
        contatos:
          type: array
          description: Presente apenas ao consultar um cliente pelo id.
          items: {$ref: '#/components/schemas/Contato'}
    ClienteEntrada:
      type: object
      required: [tipo, nome]
      properties:
        tipo: {type: string, enum: [PF, PJ]}
        nome: {type: string, maxLength: 150}
        cpf_cnpj: {type: ["string", "null"], description: CPF (PF) ou CNPJ (PJ) válido; único por empresa. Pontuação é aceita.}
        inscricao_estadual: {type: ["string", "null"], maxLength: 20}
        ie_isento: {type: boolean}
        email: {type: ["string", "null"], format: email, maxLength: 150}
        telefone: {type: ["string", "null"], maxLength: 20}
        logradouro: {type: ["string", "null"], maxLength: 150}
        numero: {type: ["string", "null"], maxLength: 20}
        bairro: {type: ["string", "null"], maxLength: 100}
        cidade: {type: ["string", "null"], maxLength: 100}
        uf: {type: ["string", "null"], minLength: 2, maxLength: 2}
        cep: {type: ["string", "null"]}
        codigo_ibge: {type: ["string", "null"]}
        tags: {type: array, items: {type: string, maxLength: 30}}
        origem: {type: ["string", "null"], maxLength: 60}
        estagio: {type: ["string", "null"], enum: [LEAD, CLIENTE, null]}
    Produto:
      type: object
      additionalProperties: false
      required: [id, sku, nome, unidade, preco_centavos, gtin, ncm, cest, origem, tributacao_icms, fiscal_fonte, fiscal_revisado_em, pendente_fiscal]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        nome: {type: string}
        unidade: {type: string}
        preco_centavos: {type: integer, description: Preço em centavos.}
        gtin: {type: ["string", "null"]}
        ncm: {type: ["string", "null"]}
        cest: {type: ["string", "null"]}
        origem: {type: ["string", "integer", "null"], description: "Origem da mercadoria (0 a 8). Zero é um valor válido (nacional)."}
        tributacao_icms: {type: ["string", "null"], enum: [NORMAL, ST, null]}
        fiscal_fonte: {type: string}
        fiscal_revisado_em: {type: ["string", "null"], format: date-time}
        pendente_fiscal: {type: boolean, description: Verdadeiro enquanto faltarem dados fiscais; a emissão é bloqueada.}
    ProdutoEntrada:
      type: object
      required: [sku, nome, unidade, preco_centavos]
      properties:
        sku: {type: string, maxLength: 60, description: Único por empresa.}
        nome: {type: string, maxLength: 150}
        unidade: {type: string, maxLength: 10}
        preco_centavos: {type: integer, minimum: 0}
        gtin: {type: ["string", "null"], maxLength: 14}
        ncm: {type: ["string", "null"]}
        cest: {type: ["string", "null"]}
        origem: {type: ["string", "integer", "null"], description: "Dígito de 0 a 8."}
        tributacao_icms: {type: ["string", "null"], enum: [NORMAL, ST, null]}
    Servico:
      type: object
      additionalProperties: false
      required: [id, codigo, nome, preco_centavos, codigo_lc116, c_trib_nac, codigo_municipal, aliquota_iss, nbs, pendente_fiscal]
      properties:
        id: {type: string, format: uuid}
        codigo: {type: ["string", "null"]}
        nome: {type: string}
        preco_centavos: {type: integer}
        codigo_lc116: {type: ["string", "null"], description: "Formato 00.00."}
        c_trib_nac: {type: ["string", "null"], description: Seis dígitos.}
        codigo_municipal: {type: ["string", "null"], description: Três dígitos.}
        aliquota_iss: {type: ["number", "string", "null"], description: Percentual de 0 a 100.}
        nbs: {type: ["string", "null"]}
        pendente_fiscal: {type: boolean}
    ServicoEntrada:
      type: object
      required: [nome, preco_centavos]
      properties:
        codigo: {type: ["string", "null"], maxLength: 60, description: Único por empresa.}
        nome: {type: string, maxLength: 150}
        preco_centavos: {type: integer, minimum: 0}
        codigo_lc116: {type: ["string", "null"], pattern: '^\d{2}\.\d{2}$'}
        c_trib_nac: {type: ["string", "null"], pattern: '^\d{6}$'}
        codigo_municipal: {type: ["string", "null"], pattern: '^\d{3}$'}
        aliquota_iss: {type: ["number", "null"], minimum: 0, maximum: 100}
        nbs: {type: ["string", "null"], maxLength: 9}
    Empresa:
      type: object
      additionalProperties: false
      required: [razao_social, nome_fantasia, cnpj, logradouro, numero, bairro, cidade, uf, cep, codigo_ibge, regime_tributario, inscricao_estadual, inscricao_municipal, cnae, ambiente_fiscal, certificado_status, certificado_validade, ambiente_da_chave]
      properties:
        razao_social: {type: ["string", "null"]}
        nome_fantasia: {type: ["string", "null"]}
        cnpj: {type: ["string", "null"]}
        logradouro: {type: ["string", "null"]}
        numero: {type: ["string", "null"]}
        bairro: {type: ["string", "null"]}
        cidade: {type: ["string", "null"]}
        uf: {type: ["string", "null"]}
        cep: {type: ["string", "null"]}
        codigo_ibge: {type: ["string", "null"]}
        regime_tributario: {type: ["string", "null"]}
        inscricao_estadual: {type: ["string", "null"]}
        inscricao_municipal: {type: ["string", "null"]}
        cnae: {type: ["string", "null"]}
        ambiente_fiscal: {type: ["string", "null"], description: Ambiente de emissão configurado na empresa.}
        certificado_status: {type: ["string", "null"]}
        certificado_validade: {type: ["string", "null"], format: date}
        ambiente_da_chave: {type: string, enum: [live, test], description: Ambiente da chave usada na requisição.}
    ConsumoItem:
      type: object
      additionalProperties: false
      required: [recurso, uso, limite]
      properties:
        recurso: {type: string}
        uso: {type: integer}
        limite: {type: integer, description: "-1 quando ilimitado."}
    RespostaDeEmpresa:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Empresa'}
    RespostaDeConsumo:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ConsumoItem'}}
    RespostaDeCliente:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Cliente'}
    ListaDeClientes:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Cliente'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
    RespostaDeProduto:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Produto'}
    ListaDeProdutos:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Produto'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
    RespostaDeServico:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Servico'}
    ListaDeServicos:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Servico'}}
        links: {$ref: '#/components/schemas/LinksDePagina'}
        meta: {$ref: '#/components/schemas/MetaDePagina'}
  responses:
    NaoAutenticado:
      description: Chave ausente, inválida ou revogada (`API_CHAVE_AUSENTE`, `API_CHAVE_INVALIDA`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NaoEncontrado:
      description: O recurso não existe ou pertence a outra empresa (`RECURSO_NAO_ENCONTRADO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Validacao:
      description: Dados inválidos (`VALIDACAO`, com `errors[]`) ou cursor inválido (`CURSOR_INVALIDO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LimiteExcedido:
      description: Limite de requisições da chave excedido (`API_LIMITE_EXCEDIDO`).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
